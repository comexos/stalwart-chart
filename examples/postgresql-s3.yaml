---
# Create the referenced Secrets in the release namespace before installing.
existingSecret: "stalwart-admin"

dataStore:
  backend: "postgresql"
  postgresql:
    host: "postgres.database.svc.cluster.local"
    database: "stalwart"
    username: "stalwart"
    existingSecret: "stalwart-postgresql"
    passwordSecretKey: "password"
    useTls: true

persistence:
  enabled: false

blobStore:
  backend: "s3"
  s3:
    bucket: "stalwart-mail"
    region: "EuCentral1"
    existingSecret: "stalwart-s3"
    accessKeyIdSecretKey: "accessKeyId"
    secretKeySecretKey: "secretKey"
    # For MinIO/other S3-compatible services:
    # custom:
    #   url: https://minio.storage.svc.cluster.local:9000
    #   region: us-east-1

provisioning:
  username: "admin"
  existingSecret: "stalwart-admin"
  passwordSecretKey: "password"
...
