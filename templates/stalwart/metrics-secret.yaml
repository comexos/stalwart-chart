{{/* The ServiceMonitor CRD requires basicAuth.username as a SecretKeySelector
     even though Stalwart's own schema treats it as a plain, non-secret field. */}}
{{- if and .Values.metrics.serviceMonitor.enabled (or .Values.metrics.auth.existingSecret .Values.metrics.auth.password) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stalwart.fullname" . }}-metrics-auth
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.metrics.auth.username | quote }}
{{- end }}
