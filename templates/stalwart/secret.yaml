{{- if eq (include "stalwart.needsManagedSecret" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stalwart.fullname" . }}-env
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
  {{- with .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- if and .Values.recoveryAdmin.enabled (not .Values.recoveryAdmin.existingSecret) }}
  STALWART_RECOVERY_ADMIN: {{ printf "%s:%s" .Values.recoveryAdmin.username (required "recoveryAdmin.password is required when recoveryAdmin.enabled=true" .Values.recoveryAdmin.password) | quote }}
  {{- end }}
  {{- if and (not .Values.config) (eq .Values.dataStore.backend "postgresql") (not (default .Values.existingSecret .Values.dataStore.postgresql.existingSecret)) .Values.dataStore.postgresql.password }}
  postgresPassword: {{ .Values.dataStore.postgresql.password | quote }}
  {{- end }}
  {{- if and (eq .Values.blobStore.backend "s3") (not .Values.blobStore.s3.existingSecret) .Values.blobStore.s3.accessKey .Values.blobStore.s3.secretKey }}
  s3AccessKey: {{ .Values.blobStore.s3.accessKey | quote }}
  s3SecretKey: {{ .Values.blobStore.s3.secretKey | quote }}
  {{- end }}
  {{- if and (eq (include "stalwart.provisioningEnabled" .) "true") (not .Values.provisioning.existingSecret) .Values.provisioning.password }}
  provisioningPassword: {{ .Values.provisioning.password | quote }}
  {{- end }}
  {{- if and .Values.metrics.enabled (not .Values.metrics.auth.existingSecret) .Values.metrics.auth.password }}
  metricsPassword: {{ .Values.metrics.auth.password | quote }}
  {{- end }}
  {{- if and (eq .Values.coordinator.type "nats") (not .Values.coordinator.nats.existingSecret) .Values.coordinator.nats.password }}
  natsPassword: {{ .Values.coordinator.nats.password | quote }}
  {{- end }}
  {{- range $key, $value := .Values.extraSecretEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
