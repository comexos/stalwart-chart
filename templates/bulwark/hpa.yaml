{{- if and .Values.webmail.enabled .Values.webmail.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "stalwart.webmailFullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "stalwart.webmailLabels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "stalwart.webmailFullname" . }}
  minReplicas: {{ .Values.webmail.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.webmail.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.webmail.autoscaling.metrics }}
    {{- toYaml .Values.webmail.autoscaling.metrics | nindent 4 }}
    {{- else }}
    {{- if .Values.webmail.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.webmail.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.webmail.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.webmail.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
    {{- end }}
  {{- with .Values.webmail.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
