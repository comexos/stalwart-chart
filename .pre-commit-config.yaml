---
# Local checks that mirror CI. Install once with: pip install pre-commit && pre-commit install
repos:
  - repo: "local"
    hooks:
      - id: "helm-lint"
        name: "helm lint (strict)"
        entry: "helm lint --strict . -f examples/postgresql-s3.yaml"
        language: "system"
        pass_filenames: false
        files: "^(templates/|values\\.yaml|values\\.schema\\.json|Chart\\.yaml)"
      - id: "yamllint"
        name: "yamllint"
        entry: "yamllint -c .yamllint.yaml"
        language: "system"
        # templates/ and charts/ are excluded by the ignore list in .yamllint.yaml.
        types: ["yaml"]
      - id: "helm-docs"
        name: "regenerate values documentation"
        entry: "scripts/generate-docs.sh"
        language: "system"
        pass_filenames: false
        files: "^(values\\.yaml|README\\.md(\\.gotmpl)?|Chart\\.yaml|scripts/generate-docs\\.sh)$"
      - id: "render-tests"
        name: "template unit tests"
        entry: "python3 tests/render.py"
        language: "system"
        pass_filenames: false
        files: "^(templates/|values\\.yaml|values\\.schema\\.json|tests/)"
      - id: "reconcile-tests"
        name: "reconciliation unit tests"
        entry: "python3 tests/test_reconcile.py"
        language: "system"
        pass_filenames: false
        files: "^(files/|tests/test_reconcile[.]py$)"
...
